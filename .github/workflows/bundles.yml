name: Package desktop apps with encoding tools

on:
  workflow_dispatch:
    inputs:
      gui_run_id:
        description: Successful Build Encode Assistant run with the GUI archives
        required: true
        type: string
        default: '44976675266'
      platform:
        description: Platform to build
        default: all
        type: choice
        options: [all, windows-x86_64, linux-x86_64, macos-arm64, macos-x86_64]

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    name: Bundle • ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
            artifact: windows
            archive: encode-assistant-windows-x64.zip
            vendor: win
            exe: .exe
          - platform: linux-x86_64
            runner: ubuntu-22.04
            artifact: linux
            archive: encode-assistant-linux-x64.tar.gz
          - platform: macos-arm64
            runner: macos-15
            artifact: macos
            archive: encode-assistant-macos.zip
            vendor: mac
          - platform: macos-x86_64
            runner: macos-15-intel
            artifact: macos
            archive: encode-assistant-macos.zip
            vendor: mac
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Select platform
        id: select
        shell: bash
        env:
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          if [[ "$SELECTED_PLATFORM" == all || "$SELECTED_PLATFORM" == "$PLATFORM" ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.select.outputs.build == 'true'
      - uses: actions/download-artifact@v7
        if: steps.select.outputs.build == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.gui_run_id }}
          name: encode-assistant-${{ matrix.artifact }}
          path: gui
      - uses: actions/setup-python@v6
        if: steps.select.outputs.build == 'true'
        with:
          python-version: '3.12'
      - name: Linux build dependencies
        if: steps.select.outputs.build == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm ninja-build zlib1g-dev
      - name: macOS build dependencies
        if: steps.select.outputs.build == 'true' && runner.os == 'macOS'
        run: |
          for dependency in nasm ninja; do
            command -v "$dependency" || brew install "$dependency"
          done
      - uses: msys2/setup-msys2@v2
        if: steps.select.outputs.build == 'true' && runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            patch
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-zlib
      - name: Restore built media toolkit
        id: media-cache
        if: steps.select.outputs.build == 'true'
        uses: actions/cache/restore@v4
        with:
          path: media
          key: media-${{ matrix.platform }}-${{ hashFiles('ci/media-sources.json', 'ci/build_media.sh', 'ci/patches/**') }}
      - name: Fetch pinned media inputs
        if: steps.select.outputs.build == 'true' && steps.media-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          MEDIAINFO_VENDOR: ${{ matrix.vendor }}
        run: |
          if [[ -n "$MEDIAINFO_VENDOR" ]]; then
            python ci/fetch_media.py media-inputs --vendor "$MEDIAINFO_VENDOR"
          else
            python ci/fetch_media.py media-inputs
          fi
      - name: Build media toolkit on Unix
        if: steps.select.outputs.build == 'true' && steps.media-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: ci/build_media.sh "$PLATFORM" media-inputs media
      - name: Build media toolkit on Windows
        if: steps.select.outputs.build == 'true' && steps.media-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: ci/build_media.sh "$PLATFORM" media-inputs media
      - name: Save built media toolkit
        if: steps.select.outputs.build == 'true' && steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: media
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - name: Build standalone worker
        if: steps.select.outputs.build == 'true'
        shell: bash
        run: |
          python -m pip install 'pyinstaller>=6.12,<7' .
          python -m PyInstaller --noconfirm --onefile --name encodeassistant --paths . --collect-submodules uvicorn ci/cli_entry.py
      - name: Assemble and check the bundle
        if: steps.select.outputs.build == 'true'
        shell: bash
        env:
          GUI_ARCHIVE: ${{ matrix.archive }}
          EXE_SUFFIX: ${{ matrix.exe }}
        run: python ci/bundle_desktop.py "$PLATFORM" "gui/$GUI_ARCHIVE" "dist/encodeassistant$EXE_SUFFIX" media packages
      - name: Include Microsoft Visual C++ Redistributable
        if: steps.select.outputs.build == 'true' && runner.os == 'Windows'
        run: python ci/include_windows_runtime.py packages/encode-assistant-windows-x86_64.zip
      - uses: actions/upload-artifact@v6
        if: steps.select.outputs.build == 'true'
        with:
          name: desktop-${{ matrix.platform }}
          path: packages/*
          if-no-files-found: error
