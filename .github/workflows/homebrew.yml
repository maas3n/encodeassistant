name: Test Homebrew CLI

on:
  push:
    branches: [main]
    paths:
      - 'Formula/**'
      - '.github/workflows/homebrew.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Homebrew • ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29
        with:
          stable: true
      - name: Install and check the public tap
        run: |
          brew tap maas3n/encodeassistant https://github.com/maas3n/encodeassistant.git
          brew install maas3n/encodeassistant/encodeassistant
          brew test maas3n/encodeassistant/encodeassistant
          encodeassistant tune --help
          encodeassistant serve --help
